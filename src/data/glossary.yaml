# Glossary entries used by <Term id="...">. Keep `meaning` short: it appears in
# a small popup. Plain language, no medical advice.

- id: hausla
  term: Hausla
  hindi: हौसला
  meaning: Courage; the spirit that keeps you going when things are hard.

- id: dharamshala
  term: Dharamshala
  hindi: धर्मशाला
  meaning: A rest house offering free or low-cost stays. Many are near large hospitals, where families stay during treatment.

- id: opd
  term: OPD
  meaning: Outpatient Department, where you see a doctor without being admitted to the hospital.
  more: Most first visits to a government hospital begin at the OPD. Registration often opens early in the morning, and some hospitals allow online registration in advance.

- id: parchi
  term: Parchi
  hindi: पर्ची
  meaning: The registration slip or card a hospital gives you. Keep it safe; you will usually need it at every visit.

- id: oncologist
  term: Oncologist
  meaning: A doctor who specialises in cancer. Medical, surgical and radiation oncologists each treat cancer in different ways.

- id: biopsy
  term: Biopsy
  meaning: A small sample of tissue taken so it can be examined under a microscope to check for cancer cells.

- id: uhid
  term: UHID
  meaning: Unique Hospital Identification number. A government hospital gives each patient one at their first visit; it stays the same for every later visit.

- id: rain-basera
  term: Rain basera
  hindi: रैन बसेरा
  meaning: A government night shelter. In Delhi, some are set up near large hospitals for patients' families.

- id: attendant
  term: Attendant
  meaning: The family member or friend who stays with a patient at the hospital.

- id: nfsa-card
  term: NFSA ration card
  meaning: A ration card issued under the National Food Security Act. Some financial-help schemes use it as proof that a family is eligible.

- id: aay
  term: Antyodaya (AAY) card
  meaning: Antyodaya Anna Yojana ration card, given to the poorest households. It is one of the cards some schemes ask for.

- id: medical-superintendent
  term: Medical Superintendent
  meaning: The senior official who runs a hospital's administration. Many scheme forms must be countersigned by them.

- id: empanelled
  term: Empanelled hospital
  meaning: A hospital that has signed up to a scheme, so patients covered by that scheme can be treated there under it.
