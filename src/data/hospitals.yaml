- id: dsci-east
  name: Delhi State Cancer Institute (East)
  type: government
  city: Delhi
  state: Delhi
  area: East Delhi
  address: Dilshad Garden, Delhi 110095
  departments:
    - Clinical oncology
    - Head and neck
    - Gynaecological oncology surgery
    - Surgery
    - Pain and palliative care
    - Paediatric haemato-oncology
  services:
    - Free General OPD and a separate paid Private OPD
    - General OPD services, including lab collection, X-rays and radiotherapy, start at 9:00 am, Monday to Saturday (closed Sundays and holidays)
    - Day-care chemotherapy
    - General (free) ward beds, plus paid semi-private and private rooms
  website: https://dsci.delhi.gov.in
  contacts:
    - label: Enquiry
      phone: 011-2213 5700
    - label: Enquiry (alternate)
      phone: 011-2213 5200
    - label: Email (Director)
      email: director.dsci@nic.in
  sources:
    - title: Citizens' Charter (as on 2026)
      publisher: Delhi State Cancer Institute, Govt. of NCT of Delhi
      url: https://dsci.delhi.gov.in/sites/default/files/dsci/news_files/citizen_charter_as_on_2026_manual_1.pdf
      accessed: 2026-11-11
  lastVerified: 2026-11-11

